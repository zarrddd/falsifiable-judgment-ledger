name: ci
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate demo ledger
        run: python3 tools/validate.py demo/demo-ledger.json
      - name: expiry discipline (pinned date keeps demo deterministic)
        run: python3 tools/expiry_check.py demo/demo-ledger.json --as-of 2026-07-01
      - name: roundtrip (full ledger loop; discipline violations must be refused)
        run: bash tests/roundtrip.sh
      - name: example ledgers conform (pinned date)
        run: |
          for f in examples/*.json; do
            python3 tools/validate.py "$f"
            python3 tools/expiry_check.py "$f" --as-of 2026-11-01
          done
      - name: path-leak guard (no leaked local machine paths in any tracked file)
        run: python3 tools/check_path_leaks.py --all
      - name: generic leak scan (example categories, filenames only)
        run: python3 tools/denylist_gate.py --blocklist blocklist.example.txt README.md SPEC.md SKILL.md USAGE.md examples/README.md examples/macro-2026.json examples/product-decisions.json examples/personal-forecasts.json schema/entry.schema.json schema/ledger.schema.json || (echo "generic scan hit - inspect locally with your private blocklist"; exit 1)
